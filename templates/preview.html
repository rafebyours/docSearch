<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Preview - {{ title }}</title> 
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"> 
    <script src="https://cdn.tailwindcss.com"></script> 
</head> 
<body class="bg-gradient-to-br from-gray-50 to-blue-50 min-h-screen"> 
    <!-- Navigation Bar --> 
    <nav class="bg-white shadow-lg"> 
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8"> 
            <div class="flex justify-between h-16 items-center"> 
                <a href="/" class="flex items-center space-x-2"> 
                    <i class="fas fa-arrow-left text-gray-600 hover:text-blue-600 transition-colors"></i> 
                    <span class="text-xl font-semibold text-gray-800">Back to Search</span> 
                </a> 
                <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent"> 
                    Document Preview 
                </h1> 
            </div> 
        </div> 
    </nav> 

    <!-- Main Content --> 
    <main class="max-w-6xl mx-auto px-4 py-8"> 
        <div class="bg-white rounded-2xl shadow-xl p-6"> 
            <!-- Document Title --> 
            <div class="mb-6 flex items-center justify-between"> 
                <h2 class="text-xl font-semibold text-gray-800"> 
                    {{ title }} 
                </h2> 
                
                <!-- Action Buttons --> 
                <div class="flex items-center space-x-4"> 
                    <!-- Download Button --> 
                    <a href="{{ download_path }}"  
                        class="inline-flex items-center px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors space-x-2" 
                        download> 
                        <i class="fas fa-download"></i> 
                        <span>Download</span> 
                    </a> 
                    
                    <!-- Save/Favorite Button --> 
                    <a href="{{ url_for('save_document', filename=title) }}"  
                        class="inline-flex items-center px-4 py-2 bg-rose-600 text-white rounded-lg hover:bg-rose-700 transition-colors space-x-2"> 
                        <i class="fas fa-heart"></i> 
                        <span>Save</span> 
                    </a> 
                </div> 
            </div> 

            <!-- Document Preview Container --> 
            <div class="bg-gray-50 rounded-xl p-4"> 
                {% if file_path %} 
                    <!-- iframe for PDF/Doc preview --> 
                    <iframe src="{{ file_path }}"  
                        title="Document Preview" 
                        class="w-full h-[700px] rounded-lg border border-gray-200 bg-white"> 
                    </iframe> 
                {% elif content %} 
                    <!-- Text content preview --> 
                    <div class="prose max-w-none p-6 bg-white rounded-lg border border-gray-200 overflow-auto whitespace-pre-wrap break-words"> 
                        {{ content|safe }} 
                    </div> 
                {% else %} 
                    <!-- Unsupported file message --> 
                    <div class="text-center py-12"> 
                        <div class="bg-gray-100 rounded-full w-20 h-20 flex items-center justify-center mx-auto mb-4"> 
                            <i class="fas fa-file-alt text-3xl text-gray-400"></i> 
                        </div> 
                        <h3 class="text-xl font-medium text-gray-700 mb-2">Preview Not Available</h3> 
                        <p class="text-gray-500">This file type is not supported for preview.</p> 
                        <a href="{{ download_path }}"  
                            class="inline-block mt-6 px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors"> 
                            Download Instead 
                        </a> 
                    </div> 
                {% endif %} 
            </div> 
        </div> 
    </main> 

    <!-- Footer --> 
    <footer class="mt-auto py-6"> 
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8"> 
            <p class="text-center text-gray-500"> 
              
            </p> 
        </div> 
    </footer> 
</body> 
</html>
